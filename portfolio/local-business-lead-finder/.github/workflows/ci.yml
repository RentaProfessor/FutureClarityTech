name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, unit tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # the checker, the score, the PDF writer, the SQL (on PGlite), the store, the build
      - run: npm test
      - name: The demo data is what scripts/build-demo-data.mjs makes
        run: |
          npm run build:demo
          git diff --exit-code public/data
      - name: The Cloudflare Pages build works
        run: npm run build

  e2e:
    name: The demo in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  python:
    name: Data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt pytest
      - run: pytest -q tests/python
