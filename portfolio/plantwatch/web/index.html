<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <!-- Everything is served from this origin (fonts included) and there are no
       inline scripts. Data only goes to Supabase, or a local Supabase during
       development; a self-hosted Supabase on another domain must be added to
       connect-src. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <title>PlantWatch</title>
  <meta name="description" content="Soil-moisture readings and watering advice for every plant in the garden" />
  <meta name="theme-color" content="#0e1f15" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PlantWatch" />
  <link rel="stylesheet" href="styles.css" />
  <!-- config.js is optional and gitignored (copy config.example.js). Without it
       the dashboard runs in demo mode. -->
  <script defer src="config.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <div id="demo-banner" class="demo-banner" role="note" hidden></div>
    <header class="hero">
      <div class="hero-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a7 7 0 0 0-7 7c0 3.5 2.5 6 7 13 4.5-7 7-9.5 7-13a7 7 0 0 0-7-7z"/>
              <path d="M12 11v11"/>
            </svg>
          </span>
          <h1>PlantWatch</h1>
        </div>
        <div class="hero-actions">
          <button type="button" id="settings" class="icon-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <button type="button" id="refresh" class="icon-btn" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
          </button>
        </div>
      </div>
      <p id="meta" class="meta">Loading the latest readings…</p>
    </header>

    <main id="main" class="main" aria-busy="true">
      <div class="hero-card hero-card--loading">
        <div class="skeleton skeleton--lg"></div>
        <div class="skeleton skeleton--md"></div>
      </div>
    </main>

    <footer class="ftr">
      <button type="button" id="toggle-view" class="link-btn">Sensor table</button>
      <span class="dot" aria-hidden="true">·</span>
      <span class="ftr-meta" id="counts-meta"></span>
    </footer>
  </div>
</body>
</html>
